[package]
name = "netscope"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
pnet = "0.35"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
